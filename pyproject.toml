[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stitch-ctx"
version = "0.1.0"
description = "AI session context manager — saves progress so your next AI session picks up where you left off"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["ai", "context", "session", "cli", "claude", "codex", "chatgpt", "llm", "developer-tools"]
authors = [
    { name = "Bishal Rana Magar", email = "bishalmagr70@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
]
dependencies = [
    "click>=8.0",
]

[project.urls]
Homepage = "https://github.com/bishalrnmagar/stitch-ctx"
Repository = "https://github.com/bishalrnmagar/stitch-ctx"
Issues = "https://github.com/bishalrnmagar/stitch-ctx/issues"

[project.scripts]
stitch = "stitch.cli:main"

[tool.setuptools.packages.find]
include = ["stitch*"]
